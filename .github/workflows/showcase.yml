name: showcase-smoke

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'examples/generate_showcase.py'
      - 'python/foveastream/**'
      - 'src/**'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -e '.[dev]'
      - name: generate synthetic showcase smoke output
        run: |
          rm -rf /tmp/foveastream-showcase
          python examples/generate_showcase.py --synthetic --outdir /tmp/foveastream-showcase --fps 6 --seconds 2 --width 320 --height 320 --gif-width 240 --gif-colors 32
          test -f /tmp/foveastream-showcase/01_multi_roi.gif
          test -f /tmp/foveastream-showcase/09_roi_atlas.gif

# Synthetic showcase generation is a CI smoke test only.
# README assets under docs/assets/showcase are real benchmark-derived examples
# and must not be automatically overwritten.
