name: showcase

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'examples/generate_showcase.py'
      - 'python/foveastream/**'
      - 'src/**'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -e '.[dev]'
      - name: generate reproducible showcase
        run: |
          rm -rf docs/assets/showcase
          python examples/generate_showcase.py --synthetic --outdir docs/assets/showcase --fps 6 --seconds 4 --width 540 --height 540 --gif-width 360 --gif-colors 48
          rm -f docs/assets/showcase/*.mp4
      - name: commit showcase assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/showcase
          if git diff --cached --quiet; then
            echo 'showcase assets unchanged'
            exit 0
          fi
          git commit -m 'docs: regenerate FoveaStream showcase GIFs [skip ci]'
          git push origin HEAD:main
