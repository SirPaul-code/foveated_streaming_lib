name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --all-targets
      - name: cargo build release
        run: cargo build --release

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: python -m pip install -e '.[dev]'
      - name: tests
        run: pytest -q
      - name: CLI smoke checks
        run: |
          python -m py_compile python/foveastream/tiles.py examples/adaptive_transport.py examples/generate_showcase.py examples/custom_tile_policy.py bench/benchmark_suite.py bench/benchmark_transport_stack.py bench/benchmark_gallery.py bench/real_video_visualization.py
          python examples/adaptive_transport.py --help
          python examples/generate_showcase.py --help
          python bench/benchmark_suite.py --help
          python bench/benchmark_gallery.py --help
