name: real-cat-usage-gallery

on:
  workflow_dispatch:
  push:
    branches: [ docs/real-cat-usage-gallery ]
    paths:
      - '.github/workflows/real-cat-gallery.yml'
      - 'README.md'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/real-cat-usage-gallery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -e '.[dev]'
      - name: Recover real cat source from checked-in real-video benchmark
        run: |
          mkdir -p /tmp/fovea-cat
          ffmpeg -y -loglevel error -i docs/assets/real_demo/example1.gif \
            -vf "crop=trunc(iw/3/2)*2:trunc(ih/2)*2:0:0,fps=12" \
            -an -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p /tmp/fovea-cat/example1_cat.mp4
      - name: Generate every main SDK usage mode from the real cat clip
        run: |
          rm -rf output/gallery/example1_cat docs/assets/benchmark_gallery/example1
          python bench/benchmark_gallery.py /tmp/fovea-cat/example1_cat.mp4 \
            --clean \
            --skip-preset-benchmarks \
            --gallery-fps 4 \
            --gallery-seconds 3 \
            --gallery-width 800 \
            --gif-width 400 \
            --showcase-size 400
          mkdir -p docs/assets/benchmark_gallery/example1
          cp -R output/gallery/example1_cat/02_core_actuators docs/assets/benchmark_gallery/example1/
          cp -R output/gallery/example1_cat/03_tile_counts docs/assets/benchmark_gallery/example1/
          cp -R output/gallery/example1_cat/04_tile_curves docs/assets/benchmark_gallery/example1/
          cp -R output/gallery/example1_cat/05_tile_aggregation docs/assets/benchmark_gallery/example1/
          cp -R output/gallery/example1_cat/06_custom_policies docs/assets/benchmark_gallery/example1/
          find docs/assets/benchmark_gallery/example1 -type f ! -name '*.gif' -delete
      - name: Commit real-cat gallery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/benchmark_gallery/example1
          if git diff --cached --quiet; then
            echo 'gallery unchanged'
            exit 0
          fi
          git commit -m 'docs: add real-cat SDK usage GIF gallery [skip ci]'
          git push origin HEAD:docs/real-cat-usage-gallery
