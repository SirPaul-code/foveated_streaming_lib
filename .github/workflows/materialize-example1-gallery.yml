name: materialize-example1-gallery

on:
  workflow_dispatch:
  push:
    branches:
      - docs/example1-real-gallery-final
    paths:
      - '.tmp_example1_gallery/**'
      - '.github/workflows/materialize-example1-gallery.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/example1-real-gallery-final
          fetch-depth: 0

      - name: Decode and install real benchmark assets
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .tmp_example1_gallery ]; then
            echo 'already materialized'
            exit 0
          fi
          cat .tmp_example1_gallery/chunk_* > /tmp/gallery.b64
          base64 -d /tmp/gallery.b64 > /tmp/gallery.tar.gz
          mkdir -p /tmp/gallery
          tar -xzf /tmp/gallery.tar.gz -C /tmp/gallery

          mkdir -p docs/assets/showcase
          cp /tmp/gallery/core/*.gif docs/assets/showcase/

          mkdir -p docs/assets/benchmark_gallery/example1/tile_counts
          mkdir -p docs/assets/benchmark_gallery/example1/curves
          mkdir -p docs/assets/benchmark_gallery/example1/aggregation
          mkdir -p docs/assets/benchmark_gallery/example1/custom

          cp /tmp/gallery/tile_counts/0010_gaussian.gif docs/assets/benchmark_gallery/example1/tile_counts/10_gaussian.gif
          cp /tmp/gallery/tile_counts/0025_gaussian.gif docs/assets/benchmark_gallery/example1/tile_counts/25_gaussian.gif
          cp /tmp/gallery/tile_counts/0100_gaussian.gif docs/assets/benchmark_gallery/example1/tile_counts/100_gaussian.gif
          cp /tmp/gallery/tile_counts/0400_gaussian.gif docs/assets/benchmark_gallery/example1/tile_counts/400_gaussian.gif
          cp /tmp/gallery/curves/*.gif docs/assets/benchmark_gallery/example1/curves/
          cp /tmp/gallery/aggregation/*.gif docs/assets/benchmark_gallery/example1/aggregation/
          cp /tmp/gallery/custom/*.gif docs/assets/benchmark_gallery/example1/custom/
          cp /tmp/gallery/tile_policies.csv docs/assets/benchmark_gallery/example1/tile_policies.csv

          printf '%s\n' '# example1 README benchmark assets' '' 'Lightweight animated derivatives of the real example1 cat-video benchmark gallery. Full-size outputs are reproducible with `python bench/benchmark_gallery.py example1.mp4 --clean`.' > docs/assets/benchmark_gallery/example1/README.md

          python .tmp_example1_gallery/patch_readme.py
          rm -rf .tmp_example1_gallery

      - name: Commit materialized gallery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'no changes'
            exit 0
          fi
          git commit -m 'docs: use real example1 benchmark gallery in README'
          git push origin HEAD:docs/example1-real-gallery-final
