[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foveastream"
version = "0.2.0"
description = "Provider-agnostic predictive foveation middleware for camera, video and vision pipelines"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
video = ["opencv-python>=4.8"]
dev = ["pytest>=8", "opencv-python>=4.8"]

[tool.setuptools]
package-dir = {"" = "python"}
[tool.setuptools.packages.find]
where = ["python"]
