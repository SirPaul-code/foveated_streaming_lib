[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foveastream"
version = "0.1.0"
description = "Foveated camera/VLM preprocessing and ROI quality-map toolkit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
video = ["opencv-python>=4.8"]
dev = ["pytest>=8", "opencv-python>=4.8"]

[tool.setuptools]
package-dir = {"" = "python"}
[tool.setuptools.packages.find]
where = ["python"]
